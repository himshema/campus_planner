  <body>
    <header>
      <nav class="navbar">
        <p class="logo">CampusPlanner</p>
        <ul class="menu">
          <li><a href="#" class="active">Dashboard</a></li>

          <li><a href="assets/about.html">About</a></li>
          <li><a href="assets/settings.html">Settings</a></li>
        </ul>
      </nav>

    <hr />
    <main>
      <section>
        <div class="hero">
          <div class="welcome">
            <h2>Hello Again!</h2>
            <p>Here is your campus life plan so far!</p>
          </div>
          <button>+Schedule</button>
        </div>
        <div class="card-section">
          <div class="hero-cards">
            <div class="card">
              <h3>Upcoming</h3>
              <p>0</p>
            </div>
            <div class="card">
              <h3>Completed</h3>
              <p>0</p>
            </div>
            <div class="card">
              <h3>Total Schedules</h3>
              <p>0</p>
            </div>
          </div>
          <div class="upcoming">
            <div class="title">
              <h2>Upcoming Schedules</h2>
              <p>sort</p>
            </div>
            <div class="activity">
              <div class="activity-description">
                <h3>Planned activity</h3>
                <p>Tag</p>
              </div>
              <p>Due date</p>
            </div>
            <button>View all Schedules -></button>
          </div>
        </div>
        <div class="history-section">
          <h2>Last 7 days Schedule structure</h2>
          <p>No plan yet</p>
        </div>
      </section>
