<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../styles/styles.css" />
    <title>MyPlanner- schedule accordingly!</title>
  </head>
  <body>
    <header class="sidebar">
      <nav class="navbar">
        <p class="logo">
          CampusPlanner 
          <button class="menu-button" id="menu-button" type="button" aria-controls="main-menu" aria-expanded="false">Menu</button>
        </p>
        <ul class="menu" id="main-menu">
          <li><a href="../index.html" class="nav-link">Dashboard</a></li>
          <li><a href="#" class="active nav-link">MyPlanner</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
          <li><a href="settings.html" class="nav-link">Settings</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <div class="hero">
        <div class="welcome">
          <h2>MyPlanner</h2>
          <p>Manage your schedules, tasks, and other campus activities!</p>
        </div>
        <a href="addRecord.html" class="schedule-link">+Schedule</a>
      </div>
      <div class="schedules">
        <input
          type="search"
          id="search"
          class="search"
          placeholder="Search by activity, tag, date, ..."
          arial-label="Search schedules"
        />
        <div class="sort">
          <label for="myPlanner-sort">Sort by: </label>
          <select class="sort-selector" name="" id="myPlanner_sort">
            <option value="all">All</option>
            <option value="title">A-Z</option>
            <option value="date">Due Date</option>
            <option value="duration">Duration</option>
          </select><br>
          <label for="completion_filter">Complettion Status: </label>
          <select class="sort-selector" name="" id="completion_filter">
            <option value="all">All schedules</option>
            <option value="pending">Not completed</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div class="" id="myPlanner-card">
          <div class="upcoming" id="myPlanner">
            
            <!--<div class="activity">
              <input type="checkbox" name="" id="" />
              <div class="activity-description">
                <h3>Planned activity</h3>
                <p>Tag</p>
              </div>
              <p>Duration</p>
              <p>Due date</p>
              <div class="action">
                <button>Edit</button>
                <button>Delete</button>
              </div>
            </div>-->
          </div>
          <p id="myPlanner-sms" role="status" aria-live="polite"></p>
         </div>
      </div>
      <hr />
      <footer>
        <center>©2026 - SHEMA Alain Bruno</center>
      </footer>
    </main>
    <script type="module" src="../scripts/search.js"></script>
    <script type="module" src="../scripts/colorTheme.js"></script>
    <script type="module" src="../scripts/colorTheme.js"></script>
    <script type="module" src="../scripts/main.js"></script>


  </body>
</html>
